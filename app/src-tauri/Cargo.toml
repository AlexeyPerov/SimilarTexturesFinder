[package]
name = "similar_textures_app"
version = "0.1.0"
description = "Similar Textures Finder desktop app host"
edition = "2021"

[lib]
name = "similar_textures_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
similar-textures-core = { path = "crates/similar-textures-core" }

[dev-dependencies]
tempfile = "3"

