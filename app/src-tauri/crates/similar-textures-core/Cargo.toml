[package]
name = "similar-textures-core"
version = "0.1.0"
edition = "2021"

[dependencies]
digest = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
md-5 = "0.10"
rayon = "1"
rustdct = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

